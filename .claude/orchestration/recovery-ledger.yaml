safety_state:
  no_secret_or_private_transcript: true
  no_external_mutation_authorized_by_this_ledger: true
  no_plugin_or_connector_delivery_requirement: true
  hard_stops:
    - "repository create, transfer, archive, rename, visibility, or history change"
    - "DNS, domain, certificate, hosting, deployment, merge, tag, publication, registry, catalog, or paid service"
    - "provider/source activation, migration, data/configuration mutation, corpus rewrite, canary, or automatic publication"
    - "visible Karaya copy without Luis read-aloud approval"
    - "protected screenshots or controlled dirty exception paths"
