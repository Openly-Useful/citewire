schema_version: 2
artifact: citewire-orchestration-recovery-ledger
as_of: "2026-08-15"
program: "CiteWire open-source and Karaya safety program"

claim_status_legend:
  Verified: "Observed locally in the current controlled workspace."
  Historical: "Recorded dated evidence that requires fresh remote revalidation before action."
  Inferred: "Bounded interpretation, not execution authority."
  Unknown: "Not established."
  Contradicted: "A lower-trust claim conflicts with a governing recorded fact."

