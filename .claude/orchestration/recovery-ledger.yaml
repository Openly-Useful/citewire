parked_prototype_findings:
  public_platform:
    claim_status: Verified
    finding: "Runtime changes precede WS-013 design; Studio trusts caller-supplied accountId; pause does not gate all writes; nested sensitive values can survive cleanup; active classifier creates a publish seam; registry input lacks schema validation; package excludes Studio; resource compatibility is not yet Node-18/22 verified."
    action_boundary: "Park the entire diff. WS-017 must implement from approved WS-013 schemas in a clean worktree and excludes Studio/plugins."
  editorial_shadow:
    claim_status: Verified
    finding: "Executable migration is present; fingerprint lacks as-of/window semantics; corpus query lacks deterministic pagination; retries/partial writes are not safely convergent; tests do not prove database/RLS/race behavior; provenance asserts 0.1.0 against upstream 6c89b6e package version 0.2.0. Focused verification stopped after 21 passing tests when one test file could not load @supabase/supabase-js because dependencies were absent; the shell was Node v24.18.0 rather than required Node 22. No install, rerun, build, audit, commit, migration, or deployment followed."
    action_boundary: "Preserve without credit. WS-012 reconciles vendor provenance; WS-014 starts only after production truth and schema sufficiency."

